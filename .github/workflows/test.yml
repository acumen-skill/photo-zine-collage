name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check release privacy
        run: python .github/scripts/check_release_privacy.py .
      - name: Validate skill metadata
        run: python .github/scripts/validate_skill.py .
      - name: Compile scripts
        run: python -m compileall -q scripts tests .github/scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
